service: nutritiontracker
image: nutritiontracker

# Host-specific values come from the environment so they stay out of the repo.
# Locally these are supplied by deploy/deploy.env (gitignored); in CI they come
# from pipeline secrets. See deploy/deploy.env.example.
servers:
  web:
    - <%= ENV.fetch("NUTRITION_TRACKER_DEPLOY_HOST") %>

registry:
  server: <%= ENV.fetch("NUTRITION_TRACKER_REGISTRY_HOST", ENV.fetch("NUTRITION_TRACKER_DEPLOY_HOST")) %>:5000
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    NT_DB_PATH: /data/nutrition.db
  secret:
    - NT_BEARER_TOKEN

volumes:
  - nutritiontracker_data:/data

proxy:
  host: <%= ENV.fetch("NUTRITION_TRACKER_PUBLIC_HOST") %>
  app_port: 8000
  healthcheck:
    path: /health
    interval: 5
    timeout: 10

builder:
  arch: <%= ENV.fetch("NUTRITION_TRACKER_DEPLOY_ARCH", "amd64") %>
  driver: docker

ssh:
  user: <%= ENV.fetch("NUTRITION_TRACKER_DEPLOY_USER") %>
  keys:
    - <%= ENV.fetch("NUTRITION_TRACKER_DEPLOY_SSH_KEY", "~/.ssh/id_rsa") %>

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: <%= ENV.fetch("NUTRITION_TRACKER_DEPLOY_HOST") %>
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f
