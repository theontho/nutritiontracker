service: nutritiontracker
image: nutritiontracker

servers:
  web:
    - 192.168.60.55

registry:
  server: 192.168.60.55:5000
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    NT_DB_PATH: /data/nutrition.db
  secret:
    - NT_BEARER_TOKEN

volumes:
  - nutritiontracker_data:/data

proxy:
  host: n.paracosmlab.com
  app_port: 8000
  healthcheck:
    path: /health
    interval: 5
    timeout: 10

builder:
  arch: amd64
  driver: docker

ssh:
  user: gregmushen
  keys:
    - ~/.ssh/stupidclaw_garageband_ed25519

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: 192.168.60.55
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f
